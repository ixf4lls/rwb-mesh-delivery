services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mesh_test
      POSTGRES_PASSWORD: mesh_test
      POSTGRES_DB: mesh_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh_test -d mesh_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - mesh_backend_demo:/var/lib/postgresql/data
volumes:
  mesh_backend_demo:
