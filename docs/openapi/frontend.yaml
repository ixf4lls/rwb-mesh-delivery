components:
  schemas:
    Id:
      type: string
      description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
    Problem:
      type: object
      required: [ type, title, status, code, traceId ]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status:
          type: integer
          format: int64
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Стабильный код для логики интерфейса.
          example: capacity_exceeded
        detail: { type: string }
        traceId:
          type: string
          description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        context: { type: object, additionalProperties: true }
    Operation:
      description: При succeeded присутствует resourceId. При failed присутствует error. Ресурс можно читать по его
        типу и ID. Префиксы ord_, exc_ и demo_ направляют gateway к владельцу команды.
      type: object
      required: [ id, status, createdAt, updatedAt, resourceType ]
      properties:
        id:
          type: string
          description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        status:
          type: string
          enum: [ queued, running, succeeded, failed ]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceType:
          type: string
          enum: [ order, return, incident, storage_case, demo_run ]
        resourceId:
          type: string
          description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        error:
          $ref: "#/components/schemas/Problem"
    Session:
      type: object
      required: [ userId, roles, pvzIds, sellerIds ]
      properties:
        userId:
          type: string
          description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        roles:
          type: array
          items:
            type: string
            enum: [ pvz_operator, seller, dispatcher, demo_admin ]
          minItems: 1
        pvzIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        sellerIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
    City:
      type: object
      required: [ id, name, timeZone ]
      properties:
        id:
          type: string
          description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        name: { type: string }
        timeZone:
          type: string
          description: Часовой пояс IANA.
          example: Europe/Moscow
    Node:
      type: object
      required: [ id, cityId, name, kind, active, mode ]
      properties:
        id:
          type: string
          description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
