openapi: 3.0.3
info:
  title: Mesh Delivery — API интерфейса
  version: 0.1.0
  description: |-
    REST API единого интерфейса ПВЗ, продавца и диспетчера. Для приемки,
    заказов, возвратов, исключений и аналитики используются одни модельные данные.
    Хаб и магистраль могут исполняться симулятором, а расчеты отражаются проводками.

    **Доступ.** Bearer JWT выдается внешним для приложения провайдером. GET /me
    возвращает роли, ПВЗ и продавцов пользователя. x-roles задает допустимые роли,
    сервер проверяет принадлежность ресурса и узел выполнения. Оператор видит свои ПВЗ,
    продавец — свои товары, строки заказов и проводки. Диспетчер управляет логистикой.
    Токен сервиса предназначен для отдельного внутреннего API.

    **Команды.** Для отмеченных операций повторяйте то же тело с тем же Idempotency-Key.
    Ключ относится к пользователю, контуру, методу и URL. При повторе возвращается исходный
    результат или ID операции. Изменение тела дает 409 idempotency_mismatch. После 202
    опрашивайте Location. Ошибка выполнения находится в error при status=failed.
    expectedVersion защищает от устаревших действий и возвращает stale_version при конфликте.

    **Данные.** Все суммы в RUB и целых копейках, отметки времени в RFC 3339.
    Списки поддерживают непрозрачный курсор. В деморежиме доменные запросы передают
    X-Demo-Run-Id из GET /demo/context. После переключения перечитайте данные с новым ID.
    Проводки отражают программные расчеты.
servers:
  - url: /api/v1
security:
  - UserBearer: []
tags:
  - name: Сессия
    description: Роли и привязки текущего пользователя.
  - name: Сеть ПВЗ
    description: Города, точки выдачи и фактическая емкость.
  - name: Приемка и хранение
    description: Товары, партии, остатки и стоимость хранения.
  - name: Заказы
    description: Котировка, создание, сборка, движение и выдача.
  - name: Возвраты
    description: Обратный маршрут, приемка, осмотр и корректировки.
  - name: Инциденты
    description: Регистрация сбоя и пересчет оставшегося маршрута.
  - name: Длительное хранение
    description: Порог, начисления, решение и вывоз.
  - name: Уведомления
    description: Журнал новых событий для продавца и ПВЗ.
  - name: Аналитика
    description: Финансовые результаты и расшифровка до проводки.
  - name: Демо
    description: Переключение подготовленных данных и тестовые часы.
  - name: Операции
    description: Статус принятой асинхронной команды.
paths:
  /me:
    get:
      tags: [ Сессия ]
      summary: Получить роли и область доступа
      operationId: getCurrentSession
      x-roles: [ pvz_operator, seller, dispatcher, demo_admin ]
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /cities:
    get:
      tags: [ Сеть ПВЗ ]
      summary: Список городов
      operationId: listCities
      x-roles: [ pvz_operator, seller, dispatcher, demo_admin ]
      x-upstream: [ svcListCities ]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /pickup-points:
    get:
      tags: [ Сеть ПВЗ ]
      summary: Список ПВЗ для выбора
      description: Возвращает точки выдачи и хранения. Доступность выбора зависит от acceptsOrders и node.active.
      operationId: listPickupPoints
      x-roles: [ pvz_operator, seller, dispatcher, demo_admin ]
      x-upstream: [ svcListPickupPoints ]
      parameters:
        - $ref: "#/components/parameters/QCity"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupPointPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /pickup-points/{pointId}/capacity:
    get:
      tags: [ Сеть ПВЗ ]
      summary: Посмотреть емкость ПВЗ
      operationId: getPointCapacity
      x-roles: [ pvz_operator, dispatcher ]
      x-upstream: [ svcGetPointCapacity ]
      parameters:
        - $ref: "#/components/parameters/PointId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capacity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /products:
    get:
      tags: [ Приемка и хранение ]
      summary: Список товаров
      operationId: listProducts
      x-roles: [ seller, pvz_operator, dispatcher ]
      x-upstream: [ svcListProducts ]
      parameters:
        - $ref: "#/components/parameters/QSeller"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [ Приемка и хранение ]
      summary: Зарегистрировать SKU продавца
      operationId: createProduct
      x-roles: [ seller, dispatcher ]
      x-upstream: [ svcCreateProduct ]
      x-error-codes: [ duplicate_seller_sku, idempotency_mismatch ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
            example:
              sellerId: seller-12
              sellerSku: mug-01
              name: Кружка 300 мл
              weightGrams: 270
              slotsPerUnit: 1
              salePriceMinor: 59000
              unitCostMinor: 26000
      responses:
        "201":
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /batches:
    get:
      tags: [ Приемка и хранение ]
      summary: Посмотреть остатки по партиям
      operationId: listBatches
      x-roles: [ pvz_operator, seller, dispatcher ]
      x-upstream: [ svcListBatches ]
      parameters:
        - $ref: "#/components/parameters/QSeller"
        - $ref: "#/components/parameters/QPoint"
        - $ref: "#/components/parameters/QProduct"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [ Приемка и хранение ]
      summary: Принять партию на хранение целиком
      description: Проверяет роль ПВЗ, доступную квоту и общие слоты. Приемка атомарна. Продавец берется из карточки SKU.
      operationId: receiveBatch
      x-roles: [ pvz_operator, dispatcher ]
      x-upstream: [ svcReceiveBatch ]
      x-error-codes: [ capacity_exceeded, storage_not_allowed, idempotency_mismatch ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchReceipt"
            example:
              productId: sku-41
              storagePointId: pvz-s1
              quantity: 5
              externalLotRef: lot-17
      responses:
        "201":
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /batches/{batchId}:
    get:
      tags: [ Приемка и хранение ]
      summary: Посмотреть партию и ее остаток
      operationId: getBatch
      x-roles: [ pvz_operator, seller, dispatcher ]
      x-upstream: [ svcGetBatch ]
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /batches/{batchId}/storage-cost:
    get:
      tags: [ Приемка и хранение ]
      summary: Посмотреть накопленную стоимость хранения
      operationId: getStorageCost
      x-roles: [ pvz_operator, seller, dispatcher ]
      x-upstream: [ svcGetStorageCost ]
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Показывает начисленную и уже проведенную стоимость по времени активного контура.
  /quotes:
    post:
      tags: [ Заказы ]
      summary: Сравнить mesh и доставку через хаб
      description: Сравнивает стоимость, ETA и применимость. Рекомендация учитывает запас, емкость ПВЗ и рейсов,
        отсечки и SLA. Продавец создает котировку для собственных SKU.
      operationId: createQuote
      x-roles: [ seller, pvz_operator, dispatcher ]
      x-upstream: [ svcCreateQuote ]
      x-error-codes: [ pickup_point_unavailable, idempotency_mismatch ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
            example:
              pickupPointId: pvz-p2
              items:
                - productId: sku-41
                  quantity: 1
      responses:
        "201":
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              example:
                id: q-31
                request:
                  pickupPointId: pvz-p2
                  items:
                    - productId: sku-41
                      quantity: 1
                createdAt: "2026-11-25T06:00:00Z"
                expiresAt: "2026-11-25T06:15:00Z"
                tariffVersionId: tariff-4
                currency: RUB
                options:
                  - id: opt-mesh
                    policy: mesh_only
                    feasible: true
                    reasons:
                      - code: local_stock
                        message: Партия доступна в ПВЗ хранения
                        nodeId: pvz-s1
                      - code: lower_cost
                        message: Есть место в городском рейсе без дополнительного заезда
                    mode: city_mesh
                    estimatedCostMinor: 1700
                    buyerFeeMinor: 2900
                    readyAt: "2026-11-25T10:30:00Z"
                    etaMinutes: 270
                    shipments:
                      - id: sh-1
                        fromNodeId: pvz-s1
                        toNodeId: pvz-p2
                        contents:
                          - productId: sku-41
                            quantity: 1
                        readyAt: "2026-11-25T10:30:00Z"
                        segments:
                          - id: seg-1
                            type: city_trip
                            fromNodeId: pvz-s1
                            toNodeId: pvz-p2
                            mode: physical
                            scheduledStartAt: "2026-11-25T10:00:00Z"
                            scheduledEndAt: "2026-11-25T10:30:00Z"
                            waitMinutes: 240
                            distanceMeters: 8500
                            estimatedCostMinor: 1700
                            costItems:
                              - category: city_trip
                                amountMinor: 1700
                            tripId: trip-24
                            cutoffAt: "2026-11-25T09:30:00Z"
                            requestedSlots: 1
                            freeTripSlots: 7
                            incrementalStops: 0
                  - id: opt-hub
                    policy: hub_only
                    feasible: true
                    reasons:
                      - code: hub_stock
                        message: Есть запас на региональном хабе
                        nodeId: hub-1
                    mode: hub
                    estimatedCostMinor: 6500
                    buyerFeeMinor: 5900
                    readyAt: "2026-11-26T10:00:00Z"
                    etaMinutes: 1680
                    shipments:
                      - id: sh-2
                        fromNodeId: hub-1
                        toNodeId: pvz-p2
                        contents:
                          - productId: sku-41
                            quantity: 1
                        readyAt: "2026-11-26T10:00:00Z"
                        segments:
                          - id: seg-2
                            type: linehaul
                            fromNodeId: hub-1
                            toNodeId: sc-1
                            mode: simulated
                            scheduledStartAt: "2026-11-25T08:00:00Z"
                            scheduledEndAt: "2026-11-26T07:00:00Z"
                            waitMinutes: 120
                            distanceMeters: 610000
                            estimatedCostMinor: 4200
                            costItems:
                              - category: linehaul
                                amountMinor: 4200
                          - id: seg-3
                            type: sorting
                            fromNodeId: sc-1
                            toNodeId: sc-1
                            mode: simulated
                            scheduledStartAt: "2026-11-26T07:30:00Z"
                            scheduledEndAt: "2026-11-26T08:30:00Z"
                            waitMinutes: 30
                            distanceMeters: 0
                            estimatedCostMinor: 1000
                            costItems:
                              - category: sorting
                                amountMinor: 1000
                          - id: seg-4
                            type: last_mile
                            fromNodeId: sc-1
                            toNodeId: pvz-p2
                            mode: physical
                            scheduledStartAt: "2026-11-26T09:00:00Z"
                            scheduledEndAt: "2026-11-26T10:00:00Z"
                            waitMinutes: 30
                            distanceMeters: 16000
                            estimatedCostMinor: 1300
                            costItems:
                              - category: last_mile
                                amountMinor: 1300
                recommendedOptionId: opt-mesh
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /orders:
    post:
      tags: [ Заказы ]
      summary: Создать заказ и зарезервировать остаток
      description: Выбранный ПВЗ фиксируется на заказе. Резервируются все его строки и места по маршруту. При
        конфликте интерфейс запрашивает новую котировку.
      operationId: createOrder
      x-roles: [ seller, pvz_operator, dispatcher ]
      x-upstream: [ svcCreateOrder ]
      x-error-codes: [ quote_expired, route_option_unavailable, insufficient_stock, capacity_exceeded, trip_capacity_exceeded ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
            example:
              quoteId: q-31
              optionId: opt-mesh
      responses:
        "202":
          description: Команда сохранена и принята в обработку.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
              example:
                id: ord_804
                status: queued
                createdAt: "2026-11-25T06:00:00Z"
                updatedAt: "2026-11-25T06:00:00Z"
                resourceType: order
          headers:
            Location:
              description: URL статуса команды в /api/v1/operations/{operationId}.
              required: true
              schema: { type: string, format: uri-reference }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [ Заказы ]
      summary: Список заказов
      operationId: listOrders
      x-roles: [ seller, pvz_operator, dispatcher ]
      x-upstream: [ svcListOrders ]
      parameters:
        - $ref: "#/components/parameters/QPoint"
        - $ref: "#/components/parameters/QSeller"
        - $ref: "#/components/parameters/QOrderStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{orderId}:
    get:
      tags: [ Заказы ]
      summary: Карточка заказа и статусы отправлений
      operationId: getOrder
      x-roles: [ seller, pvz_operator, dispatcher ]
      x-upstream: [ svcGetOrder ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{orderId}/route:
    get:
      tags: [ Заказы ]
      summary: Получить текущую или предыдущую версию маршрута
      operationId: getOrderRoute
      x-roles: [ pvz_operator, dispatcher ]
      x-upstream: [ svcGetOrderRoute ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/Revision"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      description: Возвращает версию маршрута с ценой, сроком и сегментами.
  /orders/{orderId}/events:
    get:
      tags: [ Заказы ]
      summary: Хронология заказа
      operationId: listOrderEvents
      x-roles: [ pvz_operator, dispatcher ]
      x-upstream: [ svcListOrderEvents ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
