openapi: 3.0.3
info:
  title: Mesh Delivery — взаимодействие сервисов
  version: 0.1.0
  description: |-
    REST API логических сервисов MVP. Пути можно разместить в одном backend или
    развести по сервисам за внутренним маршрутизатором. x-callers показывает имя доверенного
    вызывающего сервиса для каждой операции. В интерфейс пользователя публикуется /api/v1.

    **Доступ.** Внутренний Bearer JWT содержит идентичность и назначение сервиса.
    Gateway передает подписанную область пользователя и запрос к точке или продавцу, а сотрудник
    и роль берутся из доверенного контекста. При делегировании действует исходная область запроса.
    В системных командах область задают полномочия владельца процесса.

    **Согласованность.** Сервис-владелец сохраняет команду и ключ до ответа 202. Сетевые повторы
    переиспользуют ключ каждого шага. Межсервисные шаги запускаются из устойчивой очереди
    владельца процесса и подтверждаются по результатам вызовов. Контуры демо изолированы
    заголовком X-Demo-Run-Id. 503 оставляет команду доступной для повтора, а бизнес-конфликт
    завершает команду после освобождения предварительных резервов. После необратимого
    физического события оставшиеся записи и начисления доводятся повтором.

    **Источники состояния.** inventory владеет запасом и емкостью точек, routing — узлами,
    рейсами и котировками, orders — статусом и версией маршрута заказа, finance — версиями ставок
    и проводками, exceptions — возвратами, инцидентами, долгим хранением и уведомлениями,
    demo — контекстом сценария и его часами. Бизнес-операции используют часы выбранного контура.
    Бизнес-ключи и версии проверяются независимо от транспортного ключа повтора.
servers:
  - url: /internal/v1
security:
  - ServiceBearer: []
tags:
  - name: inventory
    description: Каталог, партии и транзакционный учет запасов и емкости ПВЗ.
  - name: orders
    description: Состояние заказа и координация его команд.
  - name: routing
    description: Справочник сети, котировки, маршруты и места в рейсах.
  - name: finance
    description: Версии тарифов, расчетные проводки и отчетные срезы.
  - name: exceptions
    description: Возвраты, инциденты, долгое хранение и уведомления.
  - name: demo
    description: Подготовленные наборы, контексты и тестовые часы.
paths:
  /inventory/points/{pointId}/capacity:
    get:
      tags: [ inventory ]
      summary: Получить фактическую емкость ПВЗ
      operationId: svcGetPointCapacity
      x-callers: [ gateway, routing, exceptions ]
      parameters:
        - $ref: "#/components/parameters/PointId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capacity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventory/products:
    get:
      tags: [ inventory ]
      summary: Читать карточки SKU в области доступа
      operationId: svcListProducts
      x-callers: [ gateway ]
      parameters:
        - $ref: "#/components/parameters/QSeller"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [ inventory ]
      summary: Создать SKU продавца
      operationId: svcCreateProduct
      x-callers: [ gateway ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
            example:
              sellerId: seller-12
              sellerSku: mug-01
              name: Кружка 300 мл
              weightGrams: 270
              slotsPerUnit: 1
              salePriceMinor: 59000
              unitCostMinor: 26000
      responses:
        "201":
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /inventory/batches:
    get:
      tags: [ inventory ]
      summary: Читать остатки по партиям
      operationId: svcListBatches
      x-callers: [ gateway, exceptions ]
      parameters:
        - $ref: "#/components/parameters/QSeller"
        - $ref: "#/components/parameters/QPoint"
        - $ref: "#/components/parameters/QProduct"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [ inventory ]
      summary: Зафиксировать приемку и занятие слотов
      description: Проверяет тип и состояние узла у routing. Закрепляет действующую версию тарифа на момент приемки.
      operationId: svcReceiveBatch
      x-callers: [ gateway ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchReceipt"
            example:
              productId: sku-41
              storagePointId: pvz-s1
              quantity: 5
              externalLotRef: lot-17
      responses:
        "201":
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /inventory/batches/{batchId}:
    get:
      tags: [ inventory ]
      summary: Читать партию и позицию остатка
      operationId: svcGetBatch
      x-callers: [ gateway, exceptions ]
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventory/batches/{batchId}/storage-cost:
    get:
      tags: [ inventory ]
      summary: Рассчитать слот-сутки и стоимость партии
      operationId: svcGetStorageCost
      x-callers: [ gateway, exceptions ]
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Объединяет рассчитанные по запасу слот-сутки и опубликованное начисление из finance. Если журнал
        временно недоступен, возвращает 503.
  /inventory/availability/search:
    post:
      tags: [ inventory ]
      summary: Найти доступные партии для корзины
      description: Чтение согласованного снимка без изменения остатков.
      operationId: svcSearchAvailability
      x-callers: [ routing ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /inventory/reservations/{orderId}:
    put:
      tags: [ inventory ]
      summary: Атомарно зарезервировать партии и емкость выдачи
      description: Уникальность резерва задает orderId. Конфликт хотя бы по одной строке откатывает резерв всех
        партий и мест.
      operationId: svcReserveOrderStock
      x-callers: [ orders ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderReservation"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [ inventory ]
      summary: Читать исходные партии и отправления заказа
      description: После выдачи сохраняет неизменяемые связи строк заказа с исходными партиями.
      operationId: svcGetOrderReservation
      x-callers: [ orders, exceptions ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventory/reservations/{orderId}/events:
    post:
      tags: [ inventory ]
      summary: Изменить состояние резерва или груза
      description: Списывает из исходной партии при первом физическом выбытии. Выдача в другом ПВЗ снимает единицы с
        учета выдачи. При выдаче с полки исходная партия уменьшается при выдаче.
      operationId: svcApplyInventoryOrderEvent
      x-callers: [ orders ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryEvent"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMutation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /inventory/movements/events:
    post:
      tags: [ inventory ]
      summary: Зафиксировать операцию возврата или вывоза
      operationId: svcApplyStockMovement
      x-callers: [ exceptions ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMoveCommand"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMutation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /inventory/storage-accruals/search:
    post:
      tags: [ inventory ]
      summary: Вернуть закрытые интервалы хранения
      description: После успешной проводки exceptions сохраняет прогресс. Неподтвержденные интервалы безопасно
        перечитываются.
      operationId: svcListStorageAccruals
      x-callers: [ exceptions ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageAccrualRequest"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageAccrualPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /orders/orders:
    post:
      tags: [ orders ]
      summary: Запустить создание заказа по котировке
      operationId: svcCreateOrder
      x-callers: [ gateway ]
      parameters:
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
            example:
              quoteId: q-31
              optionId: opt-mesh
      responses:
        "202":
          description: Команда сохранена и принята в обработку.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
          headers:
            Location:
              description: URL статуса команды в /internal/v1/orders/operations/{operationId}.
              required: true
              schema: { type: string, format: uri-reference }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Успешно использованная котировка привязана к одному заказу. Резервы разных сервисов
        подтверждаются до публикации заказа.
    get:
      tags: [ orders ]
      summary: Читать заказы
      operationId: svcListOrders
      x-callers: [ gateway ]
      parameters:
        - $ref: "#/components/parameters/QPoint"
        - $ref: "#/components/parameters/QSeller"
        - $ref: "#/components/parameters/QOrderStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/orders/{orderId}:
    get:
      tags: [ orders ]
      summary: Читать состояние заказа
      operationId: svcGetOrder
      x-callers: [ gateway, exceptions, finance ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/orders/{orderId}/route:
    get:
      tags: [ orders ]
      summary: Читать действующую версию маршрута
      operationId: svcGetOrderRoute
      x-callers: [ gateway, exceptions ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/Revision"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      description: Возвращает версию маршрута с ценой, сроком и сегментами.
  /orders/orders/{orderId}/events:
    get:
      tags: [ orders ]
      summary: Читать историю заказа
      operationId: svcListOrderEvents
      x-callers: [ gateway ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DemoRun"
      responses:
        "200":
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [ orders ]
      summary: Запустить переход состояния заказа
      description: Команда фиксирует идентификатор текущей версии и источника скана. Вызов demo разрешен только для
        симулируемых сегментов. Для demo используется время из списка simulated-actions. Это правило также
        действует для возврата и вывоза.
      operationId: svcRecordOrderEvent
      x-callers: [ gateway, demo ]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/DemoRun"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SimulationAction"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfillmentCommand"
            examples:
              pack:
                value: { type: packed, shipmentId: sh-1, expectedVersion: 1 }
              handoff:
                value:
                  type: handed_over
                  shipmentId: sh-1
                  segmentId: seg-1
                  expectedVersion: 2
              arrival:
                value:
                  type: arrived
                  shipmentId: sh-1
                  segmentId: seg-1
                  expectedVersion: 3
              issue:
                value: { type: issued, expectedVersion: 4 }
      responses:
        "202":
          description: Команда сохранена и принята в обработку.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
          headers:
            Location:
              description: URL статуса команды в /internal/v1/orders/operations/{operationId}.
              required: true
              schema: { type: string, format: uri-reference }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
