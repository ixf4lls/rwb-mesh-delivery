components:
  schemas:
    Id:
      type: string
      description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
    Timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [ type, title, status, code, traceId ]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status:
          type: integer
          format: int64
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Стабильный код для логики интерфейса.
          example: capacity_exceeded
        detail: { type: string }
        traceId:
          type: string
          description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        context: { type: object, additionalProperties: true }
    Operation:
      description: При succeeded присутствует resourceId. При failed присутствует error. Ресурс можно читать по его
        типу и ID. Префиксы ord_, exc_ и demo_ направляют gateway к владельцу команды.
      type: object
      required: [ id, status, createdAt, updatedAt, resourceType ]
      properties:
        id:
          type: string
          description: Версия тарифа обратной обработки. Сторно исходной продажи берется из оригинальных проводок.
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        status:
          type: string
